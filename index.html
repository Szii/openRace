<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>openRace — drive real streets in 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="cesiumContainer"></div>

    <div id="topbar">
      <select id="citySelect" title="Choose a city to spawn in"></select>
    </div>
    <div id="boundsMsg">Edge of the mapped 3D area — turn back.</div>

    <div id="hud">
      <div id="speed">0 km/h</div>
      <div id="status"></div>
      <div class="help">
        <b>W</b>/↑ accelerate · <b>S</b>/↓ brake &amp; reverse ·
        <b>A</b>/<b>D</b> or ←/→ steer · <b>R</b> reset · <b>C</b> change view · drag look · scroll zoom · <b>M</b> roads · <b>T</b> tunnels
      </div>
    </div>

    <div id="loading">Loading the world…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
